
services:
  data_source:
    build: .
    image: racing-line-analyzer:latest
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - DATA_DIR=/app/data
    volumes:
      - ./BrandsHatch_centerline.csv:/app/data/BrandsHatch_centerline.csv:ro
      - ./BrandsHatch_raceline.csv:/app/data/BrandsHatch_raceline.csv:ro
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      source /app/racing_ws/install/setup.bash &&
      ros2 run racing_line_analyzer track_publisher"

  processing:
    image: racing-line-analyzer:latest
    depends_on:
      - data_source
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=42
      - OUTPUT_DIR=/app/results
    volumes:
      - ./results:/app/results
    command:
      - /bin/bash
      - -c
      - |
        source /opt/ros/jazzy/setup.bash
        source /app/racing_ws/install/setup.bash

        ros2 run racing_line_analyzer geometry_analyzer &
        ros2 run racing_line_analyzer comparison_node &
        ros2 run racing_line_analyzer visualizer &

        wait
